name: build
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: merge
        run: |
          cat > /tmp/build.py <<'PYEOF'
          #!/usr/bin/env python3
          """Merge China-direct domain lists into plain-domain TXT files."""
          import re, urllib.request, datetime, json

          UA = {"User-Agent": "china-direct-domain"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read().decode("utf-8", "ignore")

          PLAIN = {
              "Loyalsoldier direct-list": "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt",
              "Loyalsoldier china-list": "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/china-list.txt",
              "blackmatrix7 China": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China_Domain.list",
              "blackmatrix7 ChinaMax": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list",
          }
          RULES = {
              "blackmatrix7 Direct": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Direct/Direct.list",
          }
          FELIX = "https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf"
          LOWERTOP = "https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf"

          DOM = re.compile(r"^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?)*$")
          domains, stats, failed = set(), {}, []

          def add(d, src):
              d = d.strip().lower().strip(".")
              if d and DOM.match(d):
                  domains.add(d); stats[src] = stats.get(src, 0) + 1

          def parse_plain(text, src):
              for l in text.splitlines():
                  l = l.strip()
                  if not l or l[0] in "#!;" or l.startswith(("regexp:", "keyword:")):
                      continue
                  for p in ("full:", "domain:"):
                      if l.startswith(p): l = l[len(p):]
                  add(l.split()[0], src)

          def parse_rules(text, src, direct_only=False):
              for l in text.splitlines():
                  l = l.strip()
                  if not l or l[0] in "#;":
                      continue
                  p = [x.strip() for x in l.split(",")]
                  if direct_only and (len(p) < 3 or p[2].upper() != "DIRECT"):
                      continue
                  if p[0].upper() in ("DOMAIN", "DOMAIN-SUFFIX", "HOST", "HOST-SUFFIX") and len(p) > 1:
                      add(p[1], src)

          for src, u in PLAIN.items():
              try: parse_plain(get(u), src)
              except Exception as e: failed.append(f"{src}: {e}")
          for src, u in RULES.items():
              try: parse_rules(get(u), src)
              except Exception as e: failed.append(f"{src}: {e}")
          try:
              for l in get(FELIX).splitlines():
                  m = re.match(r"server=/([^/]+)/", l)
                  if m: add(m.group(1), "felixonmars china-list")
          except Exception as e: failed.append(f"felixonmars: {e}")
          try:
              conf = get(LOWERTOP)
              parse_rules(conf, "LOWERTOP lazy.conf", True)
              for l in conf.splitlines():
                  p = [x.strip() for x in l.split(",")]
                  if len(p) >= 3 and p[0] == "RULE-SET" and p[2].upper() == "DIRECT":
                      try: parse_rules(get(p[1]), "LOWERTOP direct rule-sets")
                      except Exception as e: failed.append(f"LOWERTOP {p[1]}: {e}")
          except Exception as e: failed.append(f"LOWERTOP: {e}")

          if len(domains) < 50000:
              raise SystemExit(f"Too few domains ({len(domains)}), aborting. Failed: {failed}")

          keep = set()
          for d in sorted(domains, key=lambda x: x.count(".")):
              parts = d.split(".")
              if not any(".".join(parts[i:]) in keep for i in range(1, len(parts))):
                  keep.add(d)

          open("china-direct-domains-full.txt", "w").write("\n".join(sorted(domains)) + "\n")
          open("china-direct-domains.txt", "w").write("\n".join(sorted(keep)) + "\n")
          json.dump({"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
                     "full": len(domains), "compact": len(keep),
                     "sources": stats, "failed": failed},
                    open("stats.json", "w"), ensure_ascii=False, indent=2)
          print(len(domains), len(keep), failed)
          INFO = [
              ("Loyalsoldier direct-list", "Loyalsoldier/v2ray-rules-dat", "https://github.com/Loyalsoldier/v2ray-rules-dat", "direct-list.txt（release 分支）", "纯域名 / full: domain:"),
              ("Loyalsoldier china-list", "Loyalsoldier/v2ray-rules-dat", "https://github.com/Loyalsoldier/v2ray-rules-dat", "china-list.txt（release 分支）", "纯域名 / full: domain:"),
              ("blackmatrix7 China", "blackmatrix7/ios_rule_script", "https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Shadowrocket/China", "Shadowrocket/China/China_Domain.list", ".域名后缀"),
              ("blackmatrix7 ChinaMax", "blackmatrix7/ios_rule_script", "https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Shadowrocket/ChinaMax", "Shadowrocket/ChinaMax/ChinaMax_Domain.list", ".域名后缀"),
              ("blackmatrix7 Direct", "blackmatrix7/ios_rule_script", "https://github.com/blackmatrix7/ios_rule_script/tree/master/rule/Shadowrocket/Direct", "Shadowrocket/Direct/Direct.list", "DOMAIN / DOMAIN-SUFFIX 规则"),
              ("felixonmars china-list", "felixonmars/dnsmasq-china-list", "https://github.com/felixonmars/dnsmasq-china-list", "accelerated-domains.china.conf", "dnsmasq server=/域名/"),
              ("LOWERTOP direct rule-sets", "LOWERTOP/Shadowrocket", "https://github.com/LOWERTOP/Shadowrocket", "lazy.conf 中所有 RULE-SET ...,DIRECT 规则集（动态解析）", "DOMAIN / DOMAIN-SUFFIX / HOST 规则"),
              ("LOWERTOP lazy.conf", "LOWERTOP/Shadowrocket", "https://github.com/LOWERTOP/Shadowrocket/blob/main/lazy.conf", "lazy.conf 内联 DOMAIN/DOMAIN-SUFFIX ...,DIRECT", "Shadowrocket 规则"),
          ]
          RAW = "https://raw.githubusercontent.com/passionsu-su/china-direct-domain/main/"
          upd = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")
          L = ["# china-direct-domain", "",
               "合并多个开源规则库的国内直连域名，去掉前缀、正则、关键词和 IP 类规则，统一小写、校验格式后去重，输出一行一个的纯域名。每天北京时间 02:30 由 GitHub Actions 自动更新。", "",
               f"最近更新：{upd}（北京时间）", "",
               "## 文件", "",
               "| 文件 | 说明 | 条数 | 链接 |", "| --- | --- | ---: | --- |",
               f"| china-direct-domains.txt | 精简版（父域名已在列表时去掉子域名） | {len(keep):,} | [raw]({RAW}china-direct-domains.txt) |",
               f"| china-direct-domains-full.txt | 完整去重版 | {len(domains):,} | [raw]({RAW}china-direct-domains-full.txt) |",
               "| stats.json | 本次各来源条数与失败来源 | - | [raw](" + RAW + "stats.json) |", "",
               "## 上游规则库", "",
               "| 规则库 | 文件 | 格式 | 本次有效域名数 | 状态 |", "| --- | --- | --- | ---: | --- |"]
          for key, repo, url, f, fmt in INFO:
              n = stats.get(key, 0)
              pre = key if not key.startswith(("felixonmars", "LOWERTOP")) else key.split()[0]
              bad = any(x.startswith(pre) for x in failed)
              st = "⚠️ 下载失败" if bad else ("正常" if n else "无内容")
              L.append(f"| [{repo}]({url}) | {f} | {fmt} | {n:,} | {st} |")
          L += ["", "规则数为从该文件解析出的有效域名条数，不同来源间大量重叠，合并去重后见上方文件条数。", "",
                "## 处理规则", "",
                "- 去掉开头的点和 full: / domain: 前缀",
                "- 丢弃 regexp: / keyword: / DOMAIN-KEYWORD / IP-CIDR / GEOIP / USER-AGENT 等非域名规则",
                "- 统一小写，校验域名格式，去重",
                "- 精简版：按层级从短到长，父域名已收录时跳过其子域名",
                "- 某个来源下载失败时用其余来源继续，失败项写入 stats.json；总数少于 50,000 时本次不提交", ""]
          open("README.md", "w").write("\n".join(L))
          PYEOF
          python3 /tmp/build.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add china-direct-domains.txt china-direct-domains-full.txt stats.json README.md
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
