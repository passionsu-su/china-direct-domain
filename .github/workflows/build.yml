name: build
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: merge
        run: python3 build.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add china-direct-domains.txt china-direct-domains-full.txt stats.json README.md
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
      - name: purge jsdelivr cache
        continue-on-error: true
        run: |
          for f in china-direct-domains.txt china-direct-domains-full.txt stats.json README.md; do
            curl -s -m 30 "https://purge.jsdelivr.net/gh/passionsu-su/china-direct-domain@main/$f" > /dev/null || true
          done
