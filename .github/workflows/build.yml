name: build
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: merge
        run: |
          cat > /tmp/build.py <<'PYEOF'
          #!/usr/bin/env python3
          """Merge China-direct domain lists into plain-domain TXT files."""
          import re, urllib.request, datetime, json

          UA = {"User-Agent": "china-direct-domain"}
          def get(url):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read().decode("utf-8", "ignore")

          PLAIN = {
              "Loyalsoldier direct-list": "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt",
              "Loyalsoldier china-list": "https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/china-list.txt",
              "blackmatrix7 China": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China_Domain.list",
              "blackmatrix7 ChinaMax": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/ChinaMax/ChinaMax_Domain.list",
          }
          RULES = {
              "blackmatrix7 Direct": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Direct/Direct.list",
          }
          FELIX = "https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/accelerated-domains.china.conf"
          LOWERTOP = "https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf"

          DOM = re.compile(r"^[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?(\.[a-z0-9_]([a-z0-9_-]*[a-z0-9_])?)*$")
          domains, stats, failed = set(), {}, []

          def add(d, src):
              d = d.strip().lower().strip(".")
              if d and DOM.match(d):
                  domains.add(d); stats[src] = stats.get(src, 0) + 1

          def parse_plain(text, src):
              for l in text.splitlines():
                  l = l.strip()
                  if not l or l[0] in "#!;" or l.startswith(("regexp:", "keyword:")):
                      continue
                  for p in ("full:", "domain:"):
                      if l.startswith(p): l = l[len(p):]
                  add(l.split()[0], src)

          def parse_rules(text, src, direct_only=False):
              for l in text.splitlines():
                  l = l.strip()
                  if not l or l[0] in "#;":
                      continue
                  p = [x.strip() for x in l.split(",")]
                  if direct_only and (len(p) < 3 or p[2].upper() != "DIRECT"):
                      continue
                  if p[0].upper() in ("DOMAIN", "DOMAIN-SUFFIX", "HOST", "HOST-SUFFIX") and len(p) > 1:
                      add(p[1], src)

          for src, u in PLAIN.items():
              try: parse_plain(get(u), src)
              except Exception as e: failed.append(f"{src}: {e}")
          for src, u in RULES.items():
              try: parse_rules(get(u), src)
              except Exception as e: failed.append(f"{src}: {e}")
          try:
              for l in get(FELIX).splitlines():
                  m = re.match(r"server=/([^/]+)/", l)
                  if m: add(m.group(1), "felixonmars china-list")
          except Exception as e: failed.append(f"felixonmars: {e}")
          try:
              conf = get(LOWERTOP)
              parse_rules(conf, "LOWERTOP lazy.conf", True)
              for l in conf.splitlines():
                  p = [x.strip() for x in l.split(",")]
                  if len(p) >= 3 and p[0] == "RULE-SET" and p[2].upper() == "DIRECT":
                      try: parse_rules(get(p[1]), "LOWERTOP direct rule-sets")
                      except Exception as e: failed.append(f"LOWERTOP {p[1]}: {e}")
          except Exception as e: failed.append(f"LOWERTOP: {e}")

          if len(domains) < 50000:
              raise SystemExit(f"Too few domains ({len(domains)}), aborting. Failed: {failed}")

          keep = set()
          for d in sorted(domains, key=lambda x: x.count(".")):
              parts = d.split(".")
              if not any(".".join(parts[i:]) in keep for i in range(1, len(parts))):
                  keep.add(d)

          open("china-direct-domains-full.txt", "w").write("\n".join(sorted(domains)) + "\n")
          open("china-direct-domains.txt", "w").write("\n".join(sorted(keep)) + "\n")
          json.dump({"updated": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC"),
                     "full": len(domains), "compact": len(keep),
                     "sources": stats, "failed": failed},
                    open("stats.json", "w"), ensure_ascii=False, indent=2)
          print(len(domains), len(keep), failed)
          PYEOF
          python3 /tmp/build.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add china-direct-domains.txt china-direct-domains-full.txt stats.json
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
